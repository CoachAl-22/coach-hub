{% extends "base.html" %}
{% block title %}Change Password{% endblock %}
{% block page_title %}Change Password{% endblock %}

{% block content %}
<div class="card" style="max-width: 520px;">
    <h2>Change your password</h2>
    <p style="color: var(--text-muted); margin: .5rem 0 1rem;">Use at least 12 characters. Your username and coach access will stay the same.</p>
    <form method="POST" action="{{ url_for('change_password') }}">
        <input type="hidden" name="csrf_token" value="{{ session['password_csrf'] }}">
        <div class="form-group">
            <label for="current_password">Current password</label>
            <input type="password" id="current_password" name="current_password" autocomplete="current-password" required>
        </div>
        <div class="form-group">
            <label for="new_password">New password</label>
            <input type="password" id="new_password" name="new_password" autocomplete="new-password" minlength="12" required>
        </div>
        <div class="form-group">
            <label for="confirm_password">Confirm new password</label>
            <input type="password" id="confirm_password" name="confirm_password" autocomplete="new-password" minlength="12" required>
        </div>
        <button type="submit" class="btn btn-primary">Save new password</button>
    </form>
</div>
{% endblock %}
